version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: phd-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./data/seed:/docker-entrypoint-initdb.d
    networks:
      - phd-network

  redis:
    image: redis:7-alpine
    container_name: phd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - phd-network

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: phd-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/phd-platform?authSource=admin
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./packages/server:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    networks:
      - phd-network
    command: npm run dev

  client:
    build:
      context: ./packages/client
      dockerfile: Dockerfile
    container_name: phd-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - phd-network

  nginx:
    image: nginx:alpine
    container_name: phd-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - server
      - client
    networks:
      - phd-network

volumes:
  mongodb_data:
  redis_data:

networks:
  phd-network:
    driver: bridge