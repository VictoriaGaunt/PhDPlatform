version: '3.8'

services:
  # MongoDB (локальный для разработки)
  mongodb:
    image: mongo:6.0
    container_name: phd-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./data/mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - phd-network
    command: mongod --quiet --logpath /dev/null

  # Redis для кэширования
  redis:
    image: redis:7.2-alpine
    container_name: phd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - phd-network
    command: redis-server --appendonly yes

  # Бэкенд сервер
  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile.dev
    container_name: phd-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/phd-platform?authSource=admin}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./packages/server:/app
      - /app/node_modules
      - ./logs:/app/logs
    networks:
      - phd-network
    command: npm run dev

  # Фронтенд клиент
  client:
    build:
      context: ./packages/client
      dockerfile: Dockerfile.dev
    container_name: phd-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    depends_on:
      - server
    volumes:
      - ./packages/client:/app
      - /app/node_modules
    networks:
      - phd-network
    command: npm run dev

  # Mongo Express (веб-интерфейс для MongoDB) - опционально
  mongo-express:
    image: mongo-express:latest
    container_name: phd-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - phd-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  phd-network:
    driver: bridge
