version: '3.8'

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  TZ: UTC

services:
  # MongoDB база данных
  mongodb:
    image: mongo:7
    container_name: phd-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-phd_database}
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - phd-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend сервер (Node.js + Express)
  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
      target: ${NODE_ENV:-production}
    container_name: phd-server
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: ${SERVER_PORT:-3000}
      MONGODB_URI: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb:27017/${MONGODB_DATABASE}?authSource=admin
      UPLOAD_DIR: /app/uploads
    ports:
      - "${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    volumes:
      - ./packages/server/uploads:/app/uploads
      - ./packages/server/logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - phd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-3000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend клиент (Vue.js)
  client:
    build:
      context: ./packages/client
      dockerfile: Dockerfile
      target: ${NODE_ENV:-production}
    container_name: phd-client
    restart: unless-stopped
    environment:
      <<: *common-env
      VITE_API_URL: http://localhost:${SERVER_PORT:-3000}/api
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - server
    networks:
      - phd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  phd-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local